<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Simples</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calculadora {
            background: #2d3436;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 280px;
        }

        #display {
            width: 100%;
            height: 70px;
            background: #1e272e;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 32px;
            text-align: right;
            padding: 0 15px;
            margin-bottom: 15px;
            outline: none;
        }

        .botoes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;
            font-size: 22px;
            border: none;
            border-radius: 10px;
            background: #636e72;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #747d82;
        }

        button:active {
            transform: scale(0.95);
        }

        .operador {
            background: #fd79a8;
        }

        .operador:hover {
            background: #e84393;
        }

        .igual {
            background: #00b894;
        }

        .igual:hover {
            background: #00a382;
        }

        .limpar {
            background: #e17055;
            grid-column: span 4;
        }

        .limpar:hover {
            background: #d63031;
        }
    </style>
</head>
<body>

    <div class="calculadora">
        <input type="text" id="display" value="0" readonly>

        <div class="botoes">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operador">+</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operador">-</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operador">×</button>

            <button>0</button>
            <button>.</button>
            <button class="igual">=</button>
            <button class="operador">÷</button>

            <button class="limpar">C</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        const botoes = document.querySelectorAll('button');

        let valorAtual = '0';
        let valorAnterior = '';
        let operador = '';
        let esperandoNovoNumero = false;

        botoes.forEach(botao => {
            botao.addEventListener('click', () => {
                const valor = botao.textContent;

                // Números
                if (valor >= '0' && valor <= '9') {
                    if (esperandoNovoNumero) {
                        valorAtual = valor;
                        esperandoNovoNumero = false;
                    } else {
                        valorAtual = valorAtual === '0' ? valor : valorAtual + valor;
                    }
                    display.value = valorAtual;
                }

                // Ponto decimal
                else if (valor === '.') {
                    if (!valorAtual.includes('.')) {
                        valorAtual += '.';
                        display.value = valorAtual;
                    }
                }

                // Operadores
                else if (['+', '-', '×', '÷'].includes(valor)) {
                    if (operador && !esperandoNovoNumero) {
                        calcular();
                    }
                    valorAnterior = valorAtual;
                    operador = valor;
                    esperandoNovoNumero = true;
                }

                // Igual
                else if (valor === '=') {
                    calcular();
                    operador = '';
                }

                // Limpar
                else if (valor === 'C') {
                    valorAtual = '0';
                    valorAnterior = '';
                    operador = '';
                    esperandoNovoNumero = false;
                    display.value = '0';
                }
            });
        });

        function calcular() {
            if (!operador || esperandoNovoNumero) return;

            const anterior = parseFloat(valorAnterior);
            const atual = parseFloat(valorAtual);
            let resultado;

            switch (operador) {
                case '+':
                    resultado = anterior + atual;
                    break;
                case '-':
                    resultado = anterior - atual;
                    break;
                case '×':
                    resultado = anterior * atual;
                    break;
                case '÷':
                    if (atual === 0) {
                        display.value = 'Erro';
                        valorAtual = '0';
                        return;
                    }
                    resultado = anterior / atual;
                    break;
            }

            // Arredonda para evitar problemas com decimais longos
            resultado = Math.round(resultado * 100000000) / 100000000;

            valorAtual = resultado.toString();
            display.value = valorAtual;
            esperandoNovoNumero = true;
        }
    </script>

</body>
</html>
